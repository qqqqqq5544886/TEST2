<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Futures Pro (Chat)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --panel-bg: #111827;
            --accent: #f59e0b; --text: #e2e8f0; --border: #334155;
            --user-msg: #1d4ed8; --ai-msg: #374151;
        }
        body { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1800px; margin: 0 auto; }
        
        h1 { text-align: center; background: linear-gradient(to right, #f59e0b, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 20px 0; font-weight: 800; font-size: 2rem; }
        
        /* Controls */
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85em; color: #94a3b8; font-weight: 600; }
        input, select { padding: 12px; background: var(--bg-color); border: 1px solid var(--border); color: white; border-radius: 6px; outline: none; font-size: 1rem; }
        input:focus { border-color: var(--accent); }
        
        .btn { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-load { background: #374151; color: white; }
        .btn-run { background: linear-gradient(135deg, var(--accent), #d97706); color: black; font-size: 1.1em; height: 100%; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-export { background: #3b82f6; color: white; height: 100%; font-size: 1.1em; display: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Chart & Data */
        .timeframe-section { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; padding: 20px; }
        .chart-col { flex: 3; min-width: 600px; height: 520px; }
        .data-col { flex: 1; min-width: 280px; background: var(--panel-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        .tf-label { display: inline-block; padding: 6px 15px; border-radius: 6px; font-weight: bold; font-size: 1.2em; margin-bottom: 20px; text-align: center; width: fit-content; align-self: center; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 1em; }
        .data-table td { padding: 14px 0; border-bottom: 1px solid #374151; }
        .data-table tr:last-child td { border-bottom: none; }
        .dt-label { color: #9ca3af; }
        .dt-val { text-align: right; font-weight: bold; font-family: 'Courier New', monospace; font-size: 1.1em; }
        .val-up { color: #10b981; } .val-down { color: #ef4444; } .val-warn { color: #fbbf24; } .val-neutral { color: #e5e7eb; }
        
        /* Chat & Result Area */
        #chatSection { display: none; margin-top: 40px; }
        
        /* 聊天記錄區 */
        .chat-log { 
            display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; 
        }
        
        .chat-msg { 
            padding: 20px; border-radius: 12px; line-height: 1.6; max-width: 90%; 
            position: relative; animation: fadeIn 0.3s ease;
        }
        .msg-ai { 
            background: var(--card-bg); border-left: 4px solid var(--accent); align-self: flex-start; 
        }
        .msg-user { 
            background: rgba(30, 58, 138, 0.5); border-right: 4px solid #3b82f6; align-self: flex-end; 
            text-align: right; margin-left: auto;
        }
        /* User message markdown override to align right */
        .msg-user p { margin: 0; } 

        /* 聊天輸入區 */
        .chat-input-box {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .chat-tools { display: flex; align-items: center; gap: 10px; }
        #chatText { 
            width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; 
            padding: 15px; border-radius: 8px; resize: vertical; min-height: 80px; outline: none;
        }
        #chatText:focus { border-color: var(--accent); }
        .btn-send { background: #3b82f6; color: white; padding: 10px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-send:hover { background: #2563eb; }
        
        /* Markdown Styles within Chat */
        .chat-msg h2 { color: #f59e0b; margin-top: 0.5em; font-size: 1.3em; }
        .chat-msg strong { color: #fff; }
        .chat-msg ul { padding-left: 20px; }

        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s infinite linear; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .preview-img { max-height: 100px; border-radius: 4px; border: 1px solid #555; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Binance Futures Pro <span style="font-size:0.5em; color:#94a3b8">Interactive</span></h1>

    <!-- Controls -->
    <div class="controls">
        <div class="input-group">
            <label>1. Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Auto-saved">
            <button id="loadModelsBtn" class="btn btn-load">📡 載入模型</button>
        </div>
        <div class="input-group">
            <label>2. AI Model</label>
            <select id="modelSelect" disabled><option>請先載入...</option></select>
        </div>
        <div class="input-group">
            <label>3. 合約幣種</label>
            <input type="text" id="symbol" list="coinList" placeholder="輸入或選擇 (如 BTCUSDT)" style="text-transform: uppercase;">
            <datalist id="coinList"></datalist>
        </div>
        <div class="input-group" style="flex-direction: row; gap: 10px; justify-content: flex-end; align-items: flex-end;">
            <button id="runBtn" class="btn btn-run" disabled>🚀 啟動分析</button>
            <button id="exportBtn" class="btn btn-export">📥 智能匯出</button>
        </div>
    </div>

    <!-- Charts -->
    <div class="timeframe-section"><div class="chart-col" id="chart4h"></div><div class="data-col"><div class="tf-label" style="background: rgba(192, 132, 252, 0.2); color: #c084fc;">4H 趨勢層</div><div id="info4h"></div></div></div>
    <div class="timeframe-section"><div class="chart-col" id="chart1h"></div><div class="data-col"><div class="tf-label" style="background: rgba(129, 140, 248, 0.2); color: #818cf8;">1H 結構層</div><div id="info1h"></div></div></div>
    <div class="timeframe-section"><div class="chart-col" id="chart15m"></div><div class="data-col"><div class="tf-label" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8;">15M 進場層</div><div id="info15m"></div></div></div>
    
    <!-- Chat Section (取代原本單純的 ResultArea) -->
    <div id="chatSection">
        <h2 style="color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px;">💬 策略研討室 (AI Co-Pilot)</h2>
        
        <!-- 對話紀錄區 -->
        <div id="chatLog" class="chat-log"></div>

        <!-- 輸入區 -->
        <div class="chat-input-box">
            <textarea id="chatText" placeholder="輸入您的看法... (例如：我覺得 1H 這裡好像是假突破？)"></textarea>
            
            <div class="chat-tools">
                <label for="chatImgInput" class="btn btn-load" style="font-size:0.9em; padding:8px 15px; cursor:pointer;">
                    📷 上傳佐證圖片
                </label>
                <input type="file" id="chatImgInput" accept="image/*" style="display:none;">
                <span id="imgName" style="color:#94a3b8; font-size:0.8em;"></span>
                <div style="flex:1;"></div>
                <button id="sendChatBtn" class="btn-send">發送討論 ➤</button>
            </div>
            <img id="chatImgPreview" class="preview-img">
        </div>
    </div>
</div>

<script>
    // ==========================================
    const USER_API_KEY = ""; 
    // ==========================================

    const POPULAR_COINS = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "PEPEUSDT", "WIFUSDT", "SUIUSDT", "APTUSDT"];
    const TIMEFRAMES = [
        { label: '4h', chartId: 'chart4h', infoId: 'info4h', color: '#c084fc' },
        { label: '1h', chartId: 'chart1h', infoId: 'info1h', color: '#818cf8' },
        { label: '15m', chartId: 'chart15m', infoId: 'info15m', color: '#38bdf8' }
    ];
    let charts = {}; 
    const FETCH_LIMIT = 1000;
    const DISPLAY_LIMIT = 150; 

    // Chat History State
    let chatHistory = []; // 儲存對話上下文
    let exportedPrompt = "";
    let exportedImages = {};
    let currentAnalysisSymbol = "";

    // DOM
    const apiKeyInput = document.getElementById('apiKey');
    const loadModelsBtn = document.getElementById('loadModelsBtn');
    const modelSelect = document.getElementById('modelSelect');
    const runBtn = document.getElementById('runBtn');
    const exportBtn = document.getElementById('exportBtn');
    const symbolInput = document.getElementById('symbol');
    const coinList = document.getElementById('coinList');
    
    // Chat DOM
    const chatSection = document.getElementById('chatSection');
    const chatLog = document.getElementById('chatLog');
    const chatText = document.getElementById('chatText');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const chatImgInput = document.getElementById('chatImgInput');
    const chatImgPreview = document.getElementById('chatImgPreview');
    const imgName = document.getElementById('imgName');

    // Helper
    const smartFmt = (num) => {
        const n = Number(num);
        if (num === null || num === undefined || isNaN(n)) return 'N/A';
        const absVal = Math.abs(n);
        if (absVal === 0) return '0';
        if (absVal >= 1000) return n.toFixed(1);
        if (absVal >= 10) return n.toFixed(2);
        if (absVal >= 1) return n.toFixed(4);
        if (absVal >= 0.01) return n.toFixed(6);
        return n.toFixed(8);
    };

    function getStatusColor(val, type) {
        if(val===null||val===undefined) return 'val-neutral';
        if(type==='rsi') return val>70?'val-warn':(val<30?'val-up':'val-neutral');
        if(type==='vol') return val==='爆量'?'val-warn':(val==='縮量'?'val-neutral':'val-neutral');
        if(type==='ma') return val.includes('纏繞')?'val-warn':(val.includes('多')?'val-up':'val-down');
        return 'val-neutral';
    }

    // Init & Load
    function initCoinList() {
        if(!coinList) return;
        const history = JSON.parse(localStorage.getItem('coin_history') || '[]');
        const allCoins = [...new Set([...history, ...POPULAR_COINS])];
        coinList.innerHTML = ''; 
        allCoins.forEach(coin => {
            const option = document.createElement('option');
            option.value = coin;
            coinList.appendChild(option);
        });
        if(!symbolInput.value) symbolInput.value = history.length > 0 ? history[0] : "BTCUSDT";
    }

    function saveCoinHistory(symbol) {
        let history = JSON.parse(localStorage.getItem('coin_history') || '[]');
        history = history.filter(c => c !== symbol);
        history.unshift(symbol);
        if(history.length > 10) history = history.slice(0, 10);
        localStorage.setItem('coin_history', JSON.stringify(history));
        initCoinList();
    }

    window.addEventListener('DOMContentLoaded', () => {
        if(USER_API_KEY && USER_API_KEY.length > 10) {
            apiKeyInput.value = USER_API_KEY;
            setTimeout(() => { loadModelsBtn.click(); }, 500);
        } else {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) apiKeyInput.value = savedKey;
        }
        initCoinList();
    });

    loadModelsBtn.addEventListener('click', async () => {
        const key = apiKeyInput.value.trim();
        if(!key) { alert('請輸入 API Key'); return; }
        if(key !== USER_API_KEY) localStorage.setItem('gemini_api_key', key);
        
        loadModelsBtn.textContent = '⏳'; loadModelsBtn.disabled = true;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
            const data = await res.json();
            const models = (data.models || []).filter(m => m.name.includes('gemini') && m.supportedGenerationMethods?.includes('generateContent')).sort((a,b)=>(b.name.includes('flash')?1:0)-(a.name.includes('flash')?1:0));
            modelSelect.innerHTML = '';
            models.forEach(m => { const opt = document.createElement('option'); opt.value = m.name; opt.text = m.displayName || m.name.replace('models/', ''); modelSelect.appendChild(opt); });
            modelSelect.disabled = false; runBtn.disabled = false;
            loadModelsBtn.textContent = '✅'; loadModelsBtn.style.backgroundColor = '#10b981'; loadModelsBtn.style.color = 'black';
        } catch(e) { console.error(e); alert('載入失敗'); loadModelsBtn.textContent = '❌'; } finally { loadModelsBtn.disabled = false; }
    });

    // Calculations
    function calculateEMA(closes, period) {
        if (closes.length < period) return new Array(closes.length).fill(null);
        const k = 2 / (period + 1);
        let result = new Array(closes.length).fill(null);
        let sum = 0;
        for(let i=0; i<period; i++) sum += closes[i];
        result[period-1] = sum / period;
        for(let i=period; i<closes.length; i++) result[i] = closes[i] * k + result[i-1] * (1-k);
        return result;
    }

    function calculateRSI(closes, period=14) {
        if(closes.length < period + 1) return new Array(closes.length).fill(null);
        let rsi = new Array(closes.length).fill(null);
        let gains=0, losses=0;
        for(let i=1; i<=period; i++) { let diff = closes[i] - closes[i-1]; if(diff>0) gains+=diff; else losses+=Math.abs(diff); }
        let avgGain = gains/period; let avgLoss = losses/period;
        rsi[period] = 100 - (100/(1 + avgGain/avgLoss));
        for(let i=period+1; i<closes.length; i++) {
            let diff = closes[i] - closes[i-1]; let g = diff>0?diff:0; let l = diff<0?Math.abs(diff):0;
            avgGain = (avgGain*(period-1) + g)/period; avgLoss = (avgLoss*(period-1) + l)/period;
            rsi[i] = 100 - (100/(1 + avgGain/avgLoss));
        }
        return rsi;
    }

    // Export Logic
    function downloadBase64(base64, filename) {
        const link = document.createElement('a'); link.href = base64; link.download = filename;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
    exportBtn.addEventListener('click', () => {
        if(!exportedPrompt) return;
        const now = new Date();
        const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
        const sym = currentAnalysisSymbol || "CRYPTO";
        navigator.clipboard.writeText(exportedPrompt).then(() => { alert(`✅ 複製成功！圖片下載中...`); });
        if(exportedImages['4h']) downloadBase64(exportedImages['4h'], `${sym}_4H_${timeStr}.png`);
        setTimeout(() => { if(exportedImages['1h']) downloadBase64(exportedImages['1h'], `${sym}_1H_${timeStr}.png`); }, 300);
        setTimeout(() => { if(exportedImages['15m']) downloadBase64(exportedImages['15m'], `${sym}_15M_${timeStr}.png`); }, 600);
    });

    // --- Chat Functions ---
    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `chat-msg ${role === 'user' ? 'msg-user' : 'msg-ai'}`;
        div.innerHTML = marked.parse(text); // Use markdown for both
        chatLog.appendChild(div);
        // Scroll to bottom
        window.scrollTo(0, document.body.scrollHeight);
    }

    // Image Input Handling
    chatImgInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            imgName.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                chatImgPreview.src = e.target.result;
                chatImgPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // Send Chat
    sendChatBtn.addEventListener('click', async () => {
        const msg = chatText.value.trim();
        const file = chatImgInput.files[0];
        
        if (!msg && !file) return;

        // 1. UI Update
        const userDisplayMsg = msg + (file ? `<br>*(附圖: ${file.name})*` : "");
        appendMessage('user', userDisplayMsg);
        
        chatText.value = '';
        chatImgInput.value = '';
        imgName.textContent = '';
        chatImgPreview.style.display = 'none';
        
        const originalBtnText = sendChatBtn.textContent;
        sendChatBtn.disabled = true;
        sendChatBtn.textContent = "AI 思考中...";

        // 2. Prepare Payload
        const newParts = [];
        if (msg) newParts.push({ text: msg });
        
        if (file) {
            const base64Data = chatImgPreview.src.split(',')[1];
            newParts.push({ inline_data: { mime_type: file.type, data: base64Data } });
        }

        // Add to history
        chatHistory.push({ role: "user", parts: newParts });

        // 3. API Call with History
        try {
            const model = document.getElementById('modelSelect').value;
            const key = apiKeyInput.value.trim();
            
            const apiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${key}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: chatHistory })
            });
            
            const apiData = await apiRes.json();
            if(apiData.error) throw new Error(apiData.error.message);

            const aiResponse = apiData.candidates[0].content.parts[0].text;
            
            // Add AI response to history
            chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
            
            appendMessage('model', aiResponse);

        } catch (error) {
            console.error(error);
            appendMessage('model', `❌ 錯誤: ${error.message}`);
        } finally {
            sendChatBtn.disabled = false;
            sendChatBtn.textContent = originalBtnText;
        }
    });

    // --- Main Run Analysis ---
    runBtn.addEventListener('click', async () => {
        const key = apiKeyInput.value.trim();
        const symbol = symbolInput.value.toUpperCase().trim();
        if(!key || !symbol) return;
        
        saveCoinHistory(symbol);
        currentAnalysisSymbol = symbol;
        
        // Reset Chat
        chatSection.style.display = 'none';
        chatLog.innerHTML = '';
        chatHistory = []; // Clear history for new analysis

        runBtn.disabled = true; runBtn.innerHTML = '<div class="spinner"></div> 運算中...'; 
        exportBtn.style.display = 'none';

        try {
            const requests = TIMEFRAMES.map(tf => fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${tf.label}&limit=${FETCH_LIMIT}`).then(r => r.json()));
            const results = await Promise.all(requests);
            
            let aiTextSummary = `### 技術數據 (${symbol})\n*數據精度: 自動適應*\n\n`;

            results.forEach((rawData, index) => {
                const tf = TIMEFRAMES[index];
                const closes = rawData.map(d => parseFloat(d[4]));
                const volumes = rawData.map(d => parseFloat(d[5]));
                const fullEma50 = calculateEMA(closes, 50);
                const fullEma200 = calculateEMA(closes, 200);
                const fullRsi = calculateRSI(closes, 14);

                const sliceCount = -DISPLAY_LIMIT;
                const viewRawData = rawData.slice(sliceCount);
                const viewCloses = closes.slice(sliceCount);
                const viewVolumes = volumes.slice(sliceCount);
                const viewEma50 = fullEma50.slice(sliceCount);
                const viewEma200 = fullEma200.slice(sliceCount);
                const viewRsi = fullRsi.slice(sliceCount);

                const candles = viewRawData.map(d => ({ x: new Date(d[0]), y: [parseFloat(d[1]),parseFloat(d[2]),parseFloat(d[3]),parseFloat(d[4])] }));
                const volData = viewRawData.map(d => ({ x: new Date(d[0]), y: parseFloat(d[5]), fillColor: parseFloat(d[4])>=parseFloat(d[1])?'#10b981':'#ef4444' }));
                const ema50Series = viewRawData.map((d, i) => ({ x: new Date(d[0]), y: viewEma50[i] }));
                const ema200Series = viewRawData.map((d, i) => ({ x: new Date(d[0]), y: viewEma200[i] }));

                const lastIdx = viewCloses.length - 1;
                const price = viewCloses[lastIdx];
                const vLast = viewVolumes[lastIdx];
                const rsiVal = viewRsi[lastIdx];
                const valEma50 = viewEma50[lastIdx];
                const valEma200 = viewEma200[lastIdx];

                let vSum=0, count=Math.min(20, viewVolumes.length);
                for(let k=lastIdx-(count-1); k<=lastIdx; k++) vSum+=viewVolumes[k];
                const vAvg = vSum/count;
                const vStatus = vLast > vAvg*1.5 ? "爆量" : (vLast < vAvg*0.5 ? "縮量" : "正常");

                let maStatus = "不明";
                if (valEma200 !== null) {
                    const isMajor = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT"].includes(symbol);
                    const threshold = isMajor ? 0.5 : 1.2;
                    const gapPercent = Math.abs(valEma50 - valEma200) / price * 100;
                    if (gapPercent < threshold) maStatus = `⚠️ 均線纏繞 (<${threshold}%)`;
                    else if (valEma50 > valEma200) maStatus = "🟢 多頭排列";
                    else maStatus = "🔴 空頭排列";
                }

                document.getElementById(tf.infoId).innerHTML = `
                    <table class="data-table">
                        <tr><td class="dt-label">Price</td><td class="dt-val" style="color:white; font-size:1.3em;">${smartFmt(price)}</td></tr>
                        <tr><td class="dt-label">RSI(14)</td><td class="dt-val ${getStatusColor(rsiVal, 'rsi')}">${smartFmt(rsiVal)}</td></tr>
                        <tr><td class="dt-label">Volume</td><td class="dt-val ${getStatusColor(vStatus, 'vol')}">${vStatus}</td></tr>
                        <tr><td colspan="2" style="border-bottom:1px solid #555; height:10px;"></td></tr>
                        <tr><td class="dt-label">EMA 50</td><td class="dt-val" style="color:#00E396">${smartFmt(valEma50)}</td></tr>
                        <tr><td class="dt-label">EMA 200</td><td class="dt-val" style="color:#FF4560">${smartFmt(valEma200)}</td></tr>
                        <tr><td class="dt-label">狀態</td><td class="dt-val ${getStatusColor(maStatus, 'ma')}" style="font-size:0.9em">${maStatus}</td></tr>
                    </table>`;

                aiTextSummary += `**${tf.label.toUpperCase()}**:\n- Price: ${smartFmt(price)}\n- RSI: ${smartFmt(rsiVal)}\n- Vol: ${smartFmt(vLast)} (${vStatus})\n- EMA50: ${smartFmt(valEma50)}\n- EMA200: ${smartFmt(valEma200)}\n- MA狀態: ${maStatus}\n---\n`;

                if(charts[tf.label]) charts[tf.label].destroy();
                const options = {
                    series: [
                        { name: 'Price', type: 'candlestick', data: candles }, 
                        { name: 'EMA 50', type: 'line', data: ema50Series }, 
                        { name: 'EMA 200', type: 'line', data: ema200Series },
                        { name: 'Vol', type: 'bar', data: volData }
                    ],
                    chart: { type: 'line', height: 520, background: '#1e293b', toolbar: {show: false}, animations: {enabled: false}, fontFamily: 'Segoe UI' },
                    stroke: { width: [1, 2, 2, 0], colors: ['#fff', '#00E396', '#FF4560', 'transparent'] },
                    colors: ['#fff', '#00E396', '#FF4560', '#546E7A'],
                    fill: { opacity: [1, 1, 1, 0.5] },
                    plotOptions: { candlestick: { colors: { upward: '#10b981', downward: '#ef4444' } }, bar: { columnWidth: '50%' } },
                    xaxis: { type: 'datetime', labels: {style: {colors: '#94a3b8'}} },
                    yaxis: [
                        { seriesName: 'Price', labels: { style: {colors: '#94a3b8'}, formatter: (v)=>smartFmt(v) }, tooltip: {enabled: true}, forceNiceScale: true, min: (min) => min - (min * 0.002), max: (max) => max + (max * 0.002) },
                        { seriesName: 'Price', show: false },
                        { seriesName: 'Price', show: false },
                        { seriesName: 'Vol', opposite: true, labels: {show: false}, min: 0, max: (max) => max * 4 }
                    ],
                    grid: { borderColor: '#334155' }, theme: { mode: 'dark' }, 
                    tooltip: { shared: true, intersect: false, theme: 'dark', y: {formatter: (v)=>smartFmt(v)} }
                };
                charts[tf.label] = new ApexCharts(document.querySelector(`#${tf.chartId}`), options);
                charts[tf.label].render();
            });

            await new Promise(r => setTimeout(r, 1500)); 
            const img4h = await charts['4h'].dataURI(); const img1h = await charts['1h'].dataURI(); const img15m = await charts['15m'].dataURI();

            const prompt = `
                你是一位資深的加密貨幣合約操盤手。
                我提供了 ${symbol} 的三個時區圖表 (4H/1H/15M) 與精確數據。

                ${aiTextSummary}

                請進行 **深度技術分析**，並輸出 Markdown 報告：

                ### 1. 深度市場掃描 (Market Scan)
                - **4H (趨勢)**: 觀察 EMA200 趨勢方向、主要支撐壓力位。
                - **1H (結構)**: 識別價格形態 (中繼/反轉)，RSI 是否健康？
                - **15M (觸發)**: 尋找短線背離、突破或回踩訊號。

                ### 2. 均線狀態特別分析 ⚠️
                *請檢查數據中的「MA狀態」，若顯示「均線纏繞」：*
                - 請建議 **「箱體策略」**：支撐位做多，壓力位做空。
                *若顯示「多頭/空頭排列」：*
                - 請建議 **「趨勢跟隨策略」**：回踩 EMA 進場。

                ### 3. 多空理由彙整
                - 🟢 **看多依據**: ...
                - 🔴 **看空依據**: ...

                ### 4. 交易失效條件 (Invalidation)
                - 例如：「若 1H 實體黑 K 跌破 EMA200，則多頭劇本失效。」

                ### 5. 交易執行計畫 (Execution)
                *盈虧比 > 1:2*
                - **決策**: 做多 / 做空 / 觀望
                - **建議進場**: $_______ (請尋找 EMA 回踩或支撐互換位)
                - **止損 (SL)**: $_______ (結構外)
                - **止盈 (TP)**: $_______
                - **邏輯簡述**: ...
            `;
            
            exportedPrompt = prompt;
            exportedImages['4h'] = img4h.imgURI;
            exportedImages['1h'] = img1h.imgURI;
            exportedImages['15m'] = img15m.imgURI;
            exportBtn.style.display = 'block';

            // --- 1. Prepare Initial Context ---
            chatHistory = [{
                role: "user",
                parts: [
                    { text: prompt },
                    { inline_data: { mime_type: "image/png", data: img4h.imgURI.split(',')[1] } },
                    { text: "這是 4H 圖表" },
                    { inline_data: { mime_type: "image/png", data: img1h.imgURI.split(',')[1] } },
                    { text: "這是 1H 圖表" },
                    { inline_data: { mime_type: "image/png", data: img15m.imgURI.split(',')[1] } },
                    { text: "這是 15M 圖表" }
                ]
            }];

            const model = document.getElementById('modelSelect').value;
            const apiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${key}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: chatHistory }) });
            
            const apiData = await apiRes.json();
            if(apiData.error) throw new Error(apiData.error.message);
            
            const analysisText = apiData.candidates[0].content.parts[0].text;
            
            // --- 2. Save Assistant Response ---
            chatHistory.push({ role: "model", parts: [{ text: analysisText }] });

            // Display in Chat
            chatSection.style.display = 'block';
            appendMessage('model', analysisText);

        } catch(e) { console.error(e); alert('錯誤: ' + e.message); } finally { runBtn.disabled = false; runBtn.textContent = '🚀 啟動分析'; }
    });
</script>
</body>
</html>
